services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    environment:
      MINIO_ROOT_USER: ${VIDEO_STORAGE_ACCESS_KEY:-streamtube-dev}
      MINIO_ROOT_PASSWORD: ${VIDEO_STORAGE_SECRET_KEY:-streamtube-dev-secret}
      MINIO_API_STALE_UPLOADS_EXPIRY: 48h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
      MINIO_API_CORS_ALLOW_ORIGIN: ${VIDEO_STORAGE_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - video-storage:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://minio:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - video-queue:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.video-worker
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      VIDEO_STORAGE_ENDPOINT: http://minio:9000
      VIDEO_REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  video-storage:
  video-queue:
